<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan default risk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="intro">
      <h1>Loan default risk</h1>
      <p>Enter the applicant and loan details. The model returns the chance of default and a risk decision.</p>
    </header>

    <div class="layout">
      <form id="form" class="form" novalidate>
        <div class="presets">
          <button type="button" class="chip" data-preset="low">Load low-risk example</button>
          <button type="button" class="chip" data-preset="high">Load high-risk example</button>
          <button type="button" class="chip ghost" data-preset="clear">Clear</button>
        </div>

        <fieldset>
          <legend>Applicant</legend>
          <div class="grid">
            <label>Age
              <input type="number" name="person_age" min="18" max="100" step="1" placeholder="35" required>
            </label>
            <label>Annual income
              <input type="number" name="person_income" min="1" step="any" placeholder="85000" required>
            </label>
            <label>Home ownership
              <select name="person_home_ownership" required>
                <option value="" disabled selected>Select</option>
                <option value="RENT">Rent</option>
                <option value="OWN">Own</option>
                <option value="MORTGAGE">Mortgage</option>
                <option value="OTHER">Other</option>
              </select>
            </label>
            <label>Years employed
              <input type="number" name="person_emp_length" min="0" max="60" step="1" placeholder="8" required>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Loan</legend>
          <div class="grid">
            <label>Purpose
              <select name="loan_intent" required>
                <option value="" disabled selected>Select</option>
                <option value="PERSONAL">Personal</option>
                <option value="EDUCATION">Education</option>
                <option value="MEDICAL">Medical</option>
                <option value="VENTURE">Venture</option>
                <option value="HOMEIMPROVEMENT">Home improvement</option>
                <option value="DEBTCONSOLIDATION">Debt consolidation</option>
              </select>
            </label>
            <label>Loan grade
              <select name="loan_grade" required>
                <option value="" disabled selected>Select</option>
                <option>A</option><option>B</option><option>C</option><option>D</option>
                <option>E</option><option>F</option><option>G</option>
              </select>
            </label>
            <label>Loan amount
              <input type="number" name="loan_amnt" min="1" step="any" placeholder="10000" required>
            </label>
            <label>Interest rate (%)
              <input type="number" name="loan_int_rate" min="0" max="100" step="any" placeholder="7.5" required>
            </label>
            <label class="wide">Loan as share of income
              <output id="pct" for="loan_amnt person_income">Calculated from amount and income</output>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Credit history</legend>
          <div class="grid">
            <label>Previous default on file
              <select name="cb_person_default_on_file" required>
                <option value="" disabled selected>Select</option>
                <option value="N">No</option>
                <option value="Y">Yes</option>
              </select>
            </label>
            <label>Credit history (years)
              <input type="number" name="cb_person_cred_hist_length" min="0" max="80" step="1" placeholder="12" required>
            </label>
          </div>
        </fieldset>

        <p id="error" class="error" role="alert" hidden></p>
        <button type="submit" id="submit" class="primary">
          <span class="label">Assess risk</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <aside class="result" id="result" data-state="idle" aria-live="polite">
        <svg class="gauge" viewBox="0 0 240 150" role="img" aria-label="Default probability gauge">
          <path class="track" d="M20 120 A100 100 0 0 1 220 120" pathLength="100"/>
          <path class="fill" id="fill" d="M20 120 A100 100 0 0 1 220 120" pathLength="100"/>
          <g id="tick" class="tick" opacity="0">
            <line x1="120" y1="120" x2="120" y2="120"/>
            <text text-anchor="middle">cutoff</text>
          </g>
          <g id="needle" class="needle">
            <line x1="120" y1="120" x2="42" y2="120"/>
            <circle cx="120" cy="120" r="7"/>
          </g>
        </svg>

        <div class="readout">
          <div class="prob"><span id="prob">--</span><small>%</small></div>
          <div class="caption">chance of default</div>
        </div>

        <div class="verdict" id="verdict">Waiting for details</div>
        <p class="explain" id="explain">Fill in the form or load an example, then select Assess risk.</p>

        <dl class="facts" id="facts" hidden>
          <div><dt>Decision cutoff</dt><dd id="f-threshold">--</dd></div>
          <div><dt>Loan vs income</dt><dd id="f-lti">--</dd></div>
        </dl>
      </aside>
    </div>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
